# Chained security-deposit authorization refresh (pg_cron). verify_jwt = false
# because pg_cron carries no user JWT, so the gateway check is off and the
# function does its OWN auth: it accepts the `x-platform-secret` header
# (validated by the platform_verify_secret() DB RPC — same scheme as
# onboarding-daily-digest and platform-rental-notify) OR a super-admin user JWT
# for manual dispatch, and 401s everything else.
#
# It is NOT anonymously callable despite verify_jwt = false. It used to be, and
# that mattered: it accepts a caller-supplied `only_rental_id` and a refresh
# CANCELS the live authorisation before placing its replacement, so knowing a
# rental UUID was enough to force a destructive re-auth on a live hold.
#
# The pg_cron command for this job MUST send x-platform-secret. net.http_post is
# asynchronous, so a 401 lands in net._http_response and never in
# cron.job_run_details — a schedule sending the wrong credential looks healthy.
# The cron_runs heartbeat is the backstop: none is written on a 401.
[functions.refresh-deposit-holds]
verify_jwt = false

