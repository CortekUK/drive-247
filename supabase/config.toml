verify_jwt = true

[functions.inshur-end-coverage]
verify_jwt = true

[functions.inshur-cancel-coverage]
verify_jwt = true

# Cron targets. pg_cron carries no user JWT, so the gateway check is off and
# each function verifies the service-role bearer itself.
#
# Deliberately NOT an X-Cron-Secret header. The repo's cron template sends
# `Authorization: Bearer <service_role_key>` and nothing else, so a function
# demanding a bespoke secret would 401 on every tick — and because
# net.http_post is asynchronous that 401 lands in net._http_response, never in
# cron.job_run_details. The schedule would look perfectly healthy while no
# coverage was ever reconciled.
[functions.inshur-reconcile]
verify_jwt = false

[functions.inshur-sync-billing]
verify_jwt = false

# Reconciles rentals.deposit_hold_* against the real PaymentIntent at Stripe.
# Listed explicitly (verify_jwt already defaults to true) because it is easy to
# mistake for a cron target next to refresh-deposit-holds, which IS unauthenticated.
# This one is only ever called by a signed-in operator from the portal's rental
# page, it writes deposit state, and it must never become callable anonymously.
[functions.verify-deposit-hold]
verify_jwt = true
