# ---------------------------------------------------------------------------
# Square integration
# ---------------------------------------------------------------------------

# Square redirects the operator's BROWSER here after consent, so there is no
# Authorization header to verify. Protected instead by a single-use, expiring
# nonce row in square_oauth_state, which is deleted on first read.
[functions.square-oauth-callback]
verify_jwt = false

# ONE application-level subscription serves every OAuth-connected merchant, so
# this endpoint is public by construction; the tenant is resolved from the
# payload's merchant_id.
#
# verify_jwt MUST be false BEFORE the subscription is created: Square probes the
# notification URL for reachability at create time and a 401 makes creation fail
# outright.
#
# Auth is the Square signature: base64(HMAC-SHA256(key, notification_url + raw_body)).
# The URL is part of the signed message, so it must match the registered value
# byte for byte. Fails closed — a missing or bad signature is a 401 with no DB write.
[functions.square-webhook]
verify_jwt = false

# Started from the portal by an authenticated head_admin/admin (or a super
# admin), so the JWT is both present and load-bearing: without it any holder of a
# project JWT could bind their own Square account to a victim tenant.
[functions.square-oauth-start]
verify_jwt = true

# Same reasoning as square-oauth-start, and the stakes are higher in the other
# direction: this one STOPS a live merchant taking money. JWT plus the in-function
# super-admin / own-tenant-admin check.
[functions.square-disconnect]
verify_jwt = true

# Flips tenants.square_mode between sandbox and production. JWT plus the same
# super-admin / own-tenant-admin check, and a server-side readiness gate: it
# refuses to go live without a verified production connection whose location
# currency matches the tenant's.
[functions.set-square-mode]
verify_jwt = true

# pg_cron invokes this with the service-role key, which satisfies JWT
# verification, so it stays true. Square access tokens expire after 30 days and
# this is the only thing that stops a silent expiry.
[functions.refresh-square-tokens]
verify_jwt = true

# Drive247 Turo Bridge (PoC). The Chrome extension runs in a browser signed into
# turo.com, not into Drive247 — there is no Supabase JWT to present, and shipping
# an anon key inside an unpacked extension would publish it to anyone who
# installs it. The pairing token in the request body is the credential, and the
# function resolves tenant_id from it server-side.
[functions.turo-bridge-ingest]
verify_jwt = false

# turo-bridge-reconcile accepts EITHER door: the extension's pairing token in the
# body (the operator is signed into turo.com, not Drive247) or a portal JWT for
# the operator-facing actions. It therefore has to run with verify_jwt = false
# and do its own auth — which it does, refusing outright when neither credential
# is present, and 403ing when a token and a JWT name different tenants.
[functions.turo-bridge-reconcile]
verify_jwt = false

# turo-bridge-promote and turo-bridge-confirm-vehicle-map deliberately have NO
# entry here, and that is load-bearing: with no entry the gateway applies the
# default verify_jwt = true, so both refuse without a real portal session.
# Promotion creates rentals and customers; a vehicle mapping writes
# turo_vehicle_map.confirmed_by, which is NOT NULL by design. Neither decision
# may be made by a bearer of a pairing token, because a token proves which
# tenant and never which person. Do not add them.
